<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Aniversariantes</title>
    <style>
        :root { --primary: #25d366; --secondary: #128c7e; --light: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); padding: 20px; margin: 0; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .status-badge { padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 20px; font-weight: bold; font-size: 0.9em; }
        .success { background: #e8f5e9; color: #2e7d32; }
        .loading { background: #e3f2fd; color: #1976d2; }
        .error { background: #ffebee; color: #c62828; border: 1px solid #c62828; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
        .tab-btn { padding: 12px 20px; cursor: pointer; border: none; background: none; font-weight: bold; color: #666; font-size: 1em; }
        .tab-btn.active { color: var(--secondary); border-bottom: 3px solid var(--secondary); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .filters { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; background: #f1f3f4; padding: 15px; border-radius: 8px; }
        
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 800px; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: var(--secondary); color: white; text-transform: uppercase; font-size: 0.85em; letter-spacing: 1px; }
        tr:hover { background-color: #f9f9f9; }
        
        .btn-mini { background: var(--secondary); color: white; padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-mini:hover { background: #0b5e54; }
        
        .card { border: 2px solid var(--secondary); padding: 40px; text-align: center; border-radius: 20px; margin: 20px 0; background: #fff; box-shadow: inset 0 0 50px rgba(0,0,0,0.02); }
        .btn-whats { background: var(--primary); color: white; padding: 18px 40px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 1.1em; transition: 0.3s; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); }
        .btn-whats:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4); }

        select { padding: 10px; border-radius: 6px; border: 1px solid #ccc; outline: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="status" class="status-badge loading">🔄 Conectando ao Google Sheets...</div>

    <div class="tabs">
        <button class="tab-btn active" id="btn-tab-listagem" onclick="openTab('listagem')">Aniversariantes do Dia</button>
        <button class="tab-btn" id="btn-tab-gerador" onclick="openTab('gerador')">Gerar Cartão Individual</button>
    </div>

    <div id="listagem" class="tab-content active">
        <div class="filters">
            <label><strong>Filtrar Unidade:</strong></label>
            <select id="filtroUnidade" onchange="processar()"></select>
            <span id="contadorAniversariantes" style="margin-left: auto; font-weight: bold; color: var(--secondary);"></span>
        </div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Unidade</th>
                        <th>Matrícula</th>
                        <th>Colaborador</th>
                        <th>Gestão Imediata</th>
                        <th style="text-align: center;">Ação</th>
                    </tr>
                </thead>
                <tbody id="tabelaBody"></tbody>
            </table>
        </div>
    </div>

    <div id="gerador" class="tab-content">
        <div style="background: #fffbe6; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ffe58f;">
            <strong>Pesquisar manualmente:</strong>
            <select id="selectColaborador" onchange="atualizarCardManualmente()" style="width: 100%; margin-top: 10px;"></select>
        </div>
        
        <div class="card">
            <h1 style="color: var(--secondary); margin: 0; font-size: 2.5em;">Feliz Aniversário! 🎂</h1>
            <h2 id="nomeCard" style="font-size: 2.2em; margin: 20px 0; color: #222;">---</h2>
            <p id="infoAdicional" style="color: #666; font-size: 1.1em; margin-bottom: 20px;">Matrícula: --- | Unidade: ---</p>
            <p style="font-size: 1.2em; color: #444; max-width: 500px; margin: auto;">Desejamos que este novo ciclo seja repleto de conquistas, saúde e muita alegria!</p>
            <div style="margin-top: 30px; border-top: 1px dashed #ccc; padding-top: 20px;">
                <p>Atenciosamente, <strong>Gestão <span id="gestaoCard">---</span></strong></p>
            </div>
        </div>
        <div style="text-align: center;">
            <button class="btn-whats" onclick="enviarWhats()">📱 Enviar via WhatsApp Web</button>
        </div>
    </div>
</div>

<script>
    // Link da sua planilha com um parâmetro para evitar cache antigo do navegador
    const URL_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTsPqb1UFFuzyGo8kHmqv-XgcHvj38lUKffCZx8Y1Tt8BSmdfp2XD9dBeCakCVNkAMHjhJ-YV3fF3nx/pub?output=csv';
    const URL_PLANILHA = URL_BASE + '&cachebust=' + new Date().getTime();

    let dadosGlobal = [];

    async function buscarDados() {
        const statusEl = document.getElementById('status');
        try {
            const response = await fetch(URL_PLANILHA);
            if (!response.ok) throw new Error('Planilha não respondeu');
            const dataText = await response.text();
            
            // Lógica para separar CSV tratando nomes com vírgulas ou aspas
            const linhas = dataText.split(/\r?\n/).filter(l => l.trim() !== '');
            const cabecalho = processarLinhaCSV(linhas[0]);

            dadosGlobal = linhas.slice(1).map(linha => {
                const valores = processarLinhaCSV(linha);
                let obj = {};
                cabecalho.forEach((tit, i) => {
                    obj[tit.trim()] = valores[i] ? valores[i].trim() : '';
                });
                return obj;
            });

            popularFiltros();
            processar();
            statusEl.innerText = "✅ Conexão estabelecida com sucesso!";
            statusEl.className = "status-badge success";
        } catch (e) {
            statusEl.innerText = "❌ ERRO: Verifique se a planilha está 'Publicada na Web' como CSV.";
            statusEl.className = "status-badge error";
            console.error(e);
        }
    }

    function processarLinhaCSV(texto) {
        // Regex para separar por vírgula mantendo o que está entre aspas junto
        const result = [];
        let cur = '', inQuote = false;
        for (let char of texto) {
            if (char === '"') inQuote = !inQuote;
            else if (char === ',' && !inQuote) { result.push(cur); cur = ''; }
            else cur += char;
        }
        result.push(cur);
        return result;
    }

    function popularFiltros() {
        // Unidades
        const unidades = [...new Set(dadosGlobal.map(c => c.Unidade).filter(u => u))].sort();
        const fUnidade = document.getElementById('filtroUnidade');
        fUnidade.innerHTML = '<option value="TODAS">TODAS AS UNIDADES</option>';
        unidades.forEach(u => fUnidade.innerHTML += `<option value="${u}">${u}</option>`);

        // Select de busca
        const selectBusca = document.getElementById('selectColaborador');
        selectBusca.innerHTML = '<option value="">Pesquisar por nome...</option>';
        dadosGlobal.forEach((c, i) => {
            selectBusca.innerHTML += `<option value="${i}">${c.Nome} (${c.Unidade})</option>`;
        });
    }

    function processar() {
        const hoje = new Date();
        const diaH = hoje.getDate();
        const mesH = hoje.getMonth() + 1;
        const unidadeFiltro = document.getElementById('filtroUnidade').value;
        
        const tbody = document.getElementById('tabelaBody');
        let count = 0;
        tbody.innerHTML = '';

        dadosGlobal.forEach((c, i) => {
            if(!c.Nome || !c['Data de Nascimento']) return;

            // Extrai dia e mês independente se é DD/MM ou DD/MM/AAAA
            const partes = c['Data de Nascimento'].split('/');
            const dia = parseInt(partes[0]);
            const mes = parseInt(partes[1]);

            if(dia === diaH && mes === mesH) {
                if(unidadeFiltro === "TODAS" || c.Unidade === unidadeFiltro) {
                    count++;
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${c.Unidade}</strong></td>
                            <td>${c.Matricula}</td>
                            <td>${c.Nome}</td>
                            <td>${c.Gestão || '---'}</td>
                            <td style="text-align:center;">
                                <button class="btn-mini" onclick="gerarCartaoDireto(${i})">GERAR CARTÃO</button>
                            </td>
                        </tr>`;
                }
            }
        });

        document.getElementById('contadorAniversariantes').innerText = `${count} aniversariante(s) hoje`;
        if(count === 0) {
            tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; padding: 40px; color: #999;'>Nenhum aniversariante encontrado para os critérios selecionados.</td></tr>";
        }
    }

    function gerarCartaoDireto(index) {
        preencherCard(dadosGlobal[index]);
        document.getElementById('selectColaborador').value = index;
        openTab('gerador');
    }

    function atualizarCardManualmente() {
        const idx = document.getElementById('selectColaborador').value;
        if(idx) preencherCard(dadosGlobal[idx]);
    }

    function preencherCard(c) {
        document.getElementById('nomeCard').innerText = c.Nome;
        document.getElementById('gestaoCard').innerText = c.Gestão || 'Imediata';
        document.getElementById('infoAdicional').innerText = `Matrícula: ${c.Matricula} | Unidade: ${c.Unidade}`;
    }

    function openTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('btn-tab-' + id).classList.add('active');
    }

    function enviarWhats() {
        const nome = document.getElementById('nomeCard').innerText;
        if(nome === "---") return alert("Por favor, selecione um colaborador primeiro.");
        
        const msg = encodeURIComponent(`Olá, ${nome}! 🎉\n\nPassando para te desejar um Feliz Aniversário! Que seu dia seja incrível e repleto de conquistas. Muita saúde e sucesso! 🎂✨`);
        window.open(`https://web.whatsapp.com/send?text=${msg}`, '_blank');
    }

    // Início automático
    buscarDados();
</script>
</body>
</html>
