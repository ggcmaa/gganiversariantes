<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Aniversariantes CMAA</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --cmaa-verde: #006838; --cmaa-escuro: #004d2c; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1150px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--cmaa-verde); padding-bottom: 15px; margin-bottom: 20px; }
        .tabs-nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: 1px solid #ddd; background: #f8f9fa; border-radius: 8px; font-weight: bold; }
        .tab-btn.active { background: var(--cmaa-verde); color: white; border-color: var(--cmaa-verde); }
        
        .controls { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; align-items: center; }
        .select-input, .search-input { padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
        .search-input { flex-grow: 1; }
        
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--cmaa-verde); color: white; padding: 12px; text-align: left; text-transform: uppercase; font-size: 0.85em; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        
        .btn-acao { background: var(--cmaa-verde); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-wpp { background: #25D366; }
        .btn-export { background: #1d6f42; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; display: none; }

        #view-cartao { display: none; text-align: center; }
        #cartao-area { 
            width: 500px; height: 700px; 
            background: linear-gradient(135deg, var(--cmaa-escuro), var(--cmaa-verde)); 
            color: white; padding: 40px; border-radius: 10px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 20px auto; position: relative; overflow: hidden;
        }

        /* Garantindo que os símbolos apareçam no PDF */
        .decoracao { position: absolute; font-size: 50px; z-index: 10; line-height: 1; }
        .bolo { top: 30px; left: 30px; }
        .confete { top: 30px; right: 30px; }
        .balao { bottom: 130px; left: 30px; }

        .cartao-titulo { font-size: 40px; font-family: serif; font-style: italic; margin-bottom: 10px; border-bottom: 2px solid white; }
        .cartao-nome { font-size: 30px; margin: 30px 0; font-weight: bold; text-transform: uppercase; text-align: center; width: 90%; }
        .cartao-msg { font-size: 18px; line-height: 1.5; }
        .cartao-logo { margin-top: 40px; width: 200px; }
    </style>
</head>
<body>

<div class="container">
    <div id="view-lista">
        <div class="header">
            <h2 id="tituloPagina">Aniversariantes de Hoje</h2>
            <img src="Logo.png" alt="Logo CMAA" style="height: 50px;">
        </div>

        <div class="tabs-nav">
            <button class="tab-btn active" id="tabHoje" onclick="mudarAba('hoje')">Hoje</button>
            <button class="tab-btn" id="tabProximo" onclick="mudarAba('proximo')">Próximo Mês</button>
        </div>

        <div class="controls">
            <select id="filtroUnidade" class="select-input" onchange="filtrarTabela()"></select>
            <input type="text" id="buscaNome" class="search-input" placeholder="Buscar por nome..." onkeyup="filtrarTabela()">
            <button id="btnExportar" class="btn-export" onclick="exportarExcel()">📊 Exportar para Excel</button>
        </div>

        <div id="status" style="text-align:center; padding:20px;">Carregando...</div>

        <table id="tabelaAniv" style="display:none;">
            <thead>
                <tr>
                    <th>Unidade</th>
                    <th>Matrícula</th>
                    <th>Colaborador</th>
                    <th>Data</th>
                    <th>Gestão</th>
                    <th id="thAcao">Ação</th>
                </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>

    <div id="view-cartao">
        <button class="btn-acao" onclick="voltarLista()" style="background:#666; margin-bottom: 20px;">⬅ Voltar</button>
        
        <div id="cartao-area">
            <span class="decoracao bolo">🎂</span>
            <span class="decoracao confete">🎉</span>
            <span class="decoracao balao">🎈</span>
            
            <h1 class="cartao-titulo">Feliz Aniversário</h1>
            <div id="nomeColaborador" class="cartao-nome"></div>
            <h2 style="font-family: serif; font-style: italic; font-size: 50px;">Parabéns!!</h2>
            <p class="cartao-msg">Sua energia é a força que nos move e transforma o nosso mundo todos os dias.</p>
            <img src="Logobranco.png" class="cartao-logo">
        </div>

        <div style="display: flex; justify-content: center; gap: 15px; margin-top: 20px;">
            <button class="btn-acao" onclick="baixarPDF()"><i class="fas fa-file-pdf"></i> Baixar PDF</button>
            <a id="btnWhatsapp" href="#" target="_blank" class="btn-acao btn-wpp">
                <i class="fab fa-whatsapp"></i> Enviar WhatsApp
            </a>
        </div>
    </div>
</div>

<script>
    const URL_EXCEL = 'https://raw.githubusercontent.com/ggcmaa/gganiversariantes/main/index.xlsx';
    let baseDados = [];
    let dadosAtuais = [];
    let abaAtual = 'hoje';

    async function carregarDados() {
        try {
            const resp = await fetch(URL_EXCEL + '?t=' + Date.now());
            const buffer = await resp.arrayBuffer();
            const workbook = XLSX.read(new Uint8Array(buffer), {type: 'array'});
            baseDados = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { raw: false, defval: "" });
            
            const unidades = ["TODAS AS UNIDADES", ...new Set(baseDados.map(d => d.Unidade || "GERAL"))].sort();
            document.getElementById('filtroUnidade').innerHTML = unidades.map(u => `<option value="${u}">${u}</option>`).join('');
            
            filtrarTabela();
        } catch (e) { document.getElementById('status').innerText = "Erro ao carregar arquivo."; }
    }

    function mudarAba(aba) {
        abaAtual = aba;
        document.getElementById('tabHoje').classList.toggle('active', aba === 'hoje');
        document.getElementById('tabProximo').classList.toggle('active', aba === 'proximo');
        // Controle de visibilidade do botão de exportação e coluna de ação
        document.getElementById('btnExportar').style.display = aba === 'proximo' ? 'block' : 'none';
        document.getElementById('thAcao').style.display = aba === 'hoje' ? 'table-cell' : 'none';
        filtrarTabela();
    }

    function filtrarTabela() {
        const busca = document.getElementById('buscaNome').value.toLowerCase();
        const uni = document.getElementById('filtroUnidade').value;
        const hoje = new Date();
        const dH = hoje.getDate().toString().padStart(2, '0'), mH = (hoje.getMonth() + 1).toString().padStart(2, '0');
        const mP = (new Date(hoje.getFullYear(), hoje.getMonth() + 1, 1).getMonth() + 1).toString().padStart(2, '0');

        dadosAtuais = baseDados.filter(row => {
            const n = (row["Nome"] || "").toLowerCase();
            const u = row["Unidade"] || "GERAL";
            const d = row["Data de Nascimento"] || "";
            const matchesBusca = n.includes(busca) && (uni === "TODAS AS UNIDADES" || u === uni);
            if (abaAtual === 'hoje') return matchesBusca && d.startsWith(`${dH}/${mH}`);
            return matchesBusca && d.split('/')[1] === mP;
        });

        const corpo = document.getElementById('corpoTabela');
        document.getElementById('status').style.display = dadosAtuais.length ? 'none' : 'block';
        document.getElementById('tabelaAniv').style.display = dadosAtuais.length ? 'table' : 'none';
        document.getElementById('status').innerText = "Nenhum aniversariante encontrado.";

        corpo.innerHTML = dadosAtuais.map(aniv => `
            <tr>
                <td>${aniv.Unidade || ""}</td>
                <td>${aniv.Matricula || ""}</td>
                <td><b>${aniv.Nome || ""}</b></td>
                <td>${aniv["Data de Nascimento"] || ""}</td>
                <td>${aniv.Gestão || aniv.Gestao || ""}</td>
                <td style="display: ${abaAtual === 'hoje' ? 'table-cell' : 'none'}">
                    <button class="btn-acao" onclick="abrirCartao('${aniv.Nome}')">GERAR CARTÃO</button>
                </td>
            </tr>`).join('');
    }

    function abrirCartao(nome) {
        document.getElementById('view-lista').style.display = 'none';
        document.getElementById('view-cartao').style.display = 'block';
        document.getElementById('nomeColaborador').innerText = nome.toUpperCase();
        // Item 3: Configuração dinâmica do WhatsApp
        document.getElementById('btnWhatsapp').href = `https://wa.me/?text=${encodeURIComponent('Parabéns, ' + nome + '! 🎂🎈 Desejamos a você muitas felicidades!')}`;
    }

    function voltarLista() {
        document.getElementById('view-lista').style.display = 'block';
        document.getElementById('view-cartao').style.display = 'none';
    }

    function baixarPDF() {
        const area = document.getElementById('cartao-area');
        // Escala 2 ajuda a manter a qualidade dos emojis no PDF
        html2canvas(area, { scale: 2, useCORS: true }).then(canvas => {
            const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 5, 5, 200, 280);
            pdf.save(`Cartao_${document.getElementById('nomeColaborador').innerText}.pdf`);
        });
    }

    function exportarExcel() {
        if(dadosAtuais.length === 0) return;
        const ws = XLSX.utils.json_to_sheet(dadosAtuais);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Aniversariantes");
        XLSX.writeFile(wb, "Aniversariantes_CMAA.xlsx");
    }

    carregarDados();
</script>
</body>
</html>
