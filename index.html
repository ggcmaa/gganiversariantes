<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Aniversariantes CMAA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { 
            --cmaa-verde: #006838; /* Verde institucional extraído do logo */
            --cmaa-claro: #f0f4f1;
            --whatsapp: #25d366;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--cmaa-claro); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Abas */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
        .tab-btn { padding: 12px 20px; cursor: pointer; border: none; background: none; font-weight: bold; color: #666; font-size: 1em; }
        .tab-btn.active { color: var(--cmaa-verde); border-bottom: 3px solid var(--cmaa-verde); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Tabela */
        .filters { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; background: #e8ede9; padding: 15px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--cmaa-verde); color: white; padding: 12px; text-align: left; text-transform: uppercase; font-size: 0.8em; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .btn-acao { background: var(--cmaa-verde); color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* Estilo do Cartão para o PDF */
        #cartao-export {
            width: 600px;
            height: 800px;
            padding: 40px;
            background: white;
            border: 15px solid var(--cmaa-verde);
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            box-sizing: border-box;
        }
        .logo-cartao { width: 180px; margin-bottom: 40px; }
        .nome-aniversariante { font-size: 2.5em; color: #333; margin: 0; font-weight: bold; text-transform: uppercase; }
        .titulo-parabens { font-size: 4em; color: var(--cmaa-verde); margin: 10px 0; font-family: 'Georgia', serif; }
        .texto-mensagem { font-size: 1.4em; color: #555; line-height: 1.5; margin: 20px 40px; }
        .footer-cartao { margin-top: 50px; font-size: 1.2em; color: var(--cmaa-verde); font-weight: bold; }

        /* Botões */
        .area-botoes { text-align: center; margin-top: 20px; display: flex; justify-content: center; gap: 15px; }
        .btn-pdf { background: #d32f2f; color: white; padding: 15px 30px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 1.1em; }
        .btn-whatsapp { background: var(--whatsapp); color: white; padding: 15px 30px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 1.1em; text-decoration: none; }
        
        select { padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
        <h2 style="color: var(--cmaa-verde); margin: 0;">🎉 Portal de Aniversariantes</h2>
        <img src="https://cmaa.com.br/wp-content/themes/cmaa/assets/images/logo-cmaa.png" alt="CMAA" style="height: 50px;">
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="btn-tab-listagem" onclick="openTab('listagem')">Aniversariantes do Dia</button>
        <button class="tab-btn" id="btn-tab-gerador" onclick="openTab('gerador')">Gerador de Cartão PDF</button>
    </div>

    <div id="listagem" class="tab-content active">
        <div class="filters">
            <label><strong>Unidade:</strong></label>
            <select id="filtroUnidade" onchange="processar()"></select>
        </div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Unidade</th>
                        <th>Matrícula</th>
                        <th>Colaborador</th>
                        <th>Gestão</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="tabelaBody"></tbody>
            </table>
        </div>
    </div>

    <div id="gerador" class="tab-content">
        <div style="margin-bottom: 20px; text-align: center;">
            <label>Selecione manualmente:</label>
            <select id="selectColaborador" onchange="atualizarCard()" style="width: 300px;"></select>
        </div>

        <div id="cartao-export">
            <img src="https://cmaa.com.br/wp-content/themes/cmaa/assets/images/logo-cmaa.png" class="logo-cartao">
            <p class="nome-aniversariante" id="pdfNome">NOME DO COLABORADOR</p>
            <h1 class="titulo-parabens">Parabéns!!</h1>
            <p class="texto-mensagem">
                Desejamos que o seu dia seja repleto de sorrisos, 
                rodeado de pessoas queridas e que este novo ciclo 
                seja de muita energia, saúde e grandes realizações!
            </p>
            <div class="footer-cartao">
                EQUIPE <span id="pdfGestao">GESTÃO</span>
            </div>
        </div>

        <div class="area-botoes">
            <button class="btn-pdf" onclick="baixarPDF()">📄 Baixar Cartão em PDF</button>
            <button class="btn-whatsapp" onclick="enviarWhats()">📱 Enviar no WhatsApp</button>
        </div>
    </div>
</div>

<script>
    const URL_PLANILHA = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTsPqb1UFFuzyGo8kHmqv-XgcHvj38lUKffCZx8Y1Tt8BSmdfp2XD9dBeCakCVNkAMHjhJ-YV3fF3nx/pub?output=csv&cache=' + new Date().getTime();

    let dadosGlobal = [];

    async function buscarDados() {
        try {
            const response = await fetch(URL_PLANILHA);
            const dataText = await response.text();
            const linhas = dataText.split(/\r?\n/).filter(l => l.trim() !== '');
            const cabecalho = linhas[0].split(',');

            dadosGlobal = linhas.slice(1).map(linha => {
                const valores = linha.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || linha.split(',');
                let obj = {};
                cabecalho.forEach((tit, i) => {
                    let val = valores[i] ? valores[i].replace(/"/g, '').trim() : '';
                    obj[tit.trim()] = val;
                });
                return obj;
            });

            popularFiltros();
            processar();
        } catch (e) { console.error("Erro ao carregar:", e); }
    }

    function popularFiltros() {
        const unidades = [...new Set(dadosGlobal.map(c => c.Unidade).filter(u => u))].sort();
        document.getElementById('filtroUnidade').innerHTML = '<option value="TODAS">TODAS</option>' + 
            unidades.map(u => `<option value="${u}">${u}</option>`).join('');

        document.getElementById('selectColaborador').innerHTML = '<option value="">Pesquisar...</option>' + 
            dadosGlobal.map((c, i) => `<option value="${i}">${c.Nome}</option>`).join('');
    }

    function processar() {
        const hoje = new Date();
        const diaH = hoje.getDate();
        const mesH = hoje.getMonth() + 1;
        const unidade = document.getElementById('filtroUnidade').value;
        const tbody = document.getElementById('tabelaBody');
        tbody.innerHTML = '';

        dadosGlobal.forEach((c, i) => {
            const partes = c['Data de Nascimento'].split('/');
            if(parseInt(partes[0]) === diaH && parseInt(partes[1]) === mesH) {
                if(unidade === "TODAS" || c.Unidade === unidade) {
                    tbody.innerHTML += `<tr>
                        <td>${c.Unidade}</td>
                        <td>${c.Matricula}</td>
                        <td><strong>${c.Nome}</strong></td>
                        <td>${c.Gestão}</td>
                        <td><button class="btn-acao" onclick="gerarIndividual(${i})">GERAR PDF</button></td>
                    </tr>`;
                }
            }
        });
    }

    function gerarIndividual(i) {
        atualizarCard(i);
        openTab('gerador');
    }

    function atualizarCard(index) {
        const i = index !== undefined ? index : document.getElementById('selectColaborador').value;
        if(i === "") return;
        const c = dadosGlobal[i];
        document.getElementById('pdfNome').innerText = c.Nome;
        document.getElementById('pdfGestao').innerText = (c.Gestão || 'CMAA').toUpperCase();
    }

    function baixarPDF() {
        const { jsPDF } = window.jspdf;
        const elemento = document.getElementById('cartao-export');
        const nome = document.getElementById('pdfNome').innerText;

        html2canvas(elemento, { scale: 2 }).then(canvas => {
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgProps = pdf.getImageProperties(imgData);
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
            
            pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
            pdf.save(`Cartao_CMAA_${nome}.pdf`);
        });
    }

    function openTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('btn-tab-' + id).classList.add('active');
    }

    function enviarWhats() {
        const nome = document.getElementById('pdfNome').innerText;
        const msg = encodeURIComponent(`Olá, ${nome}! 🎉\n\nA CMAA deseja a você um Feliz Aniversário! Seu cartão oficial foi gerado. 🎂✨`);
        window.open(`https://web.whatsapp.com/send?text=${msg}`, '_blank');
    }

    buscarDados();
</script>

</body>
</html>
