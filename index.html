<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Aniversariantes</title>
    <style>
        :root { --primary: #25d366; --secondary: #128c7e; --light: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); padding: 20px; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
        .tab-btn { padding: 12px; cursor: pointer; border: none; background: none; font-weight: bold; color: #666; }
        .tab-btn.active { color: var(--secondary); border-bottom: 3px solid var(--secondary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: var(--secondary); color: white; }
        .card { border: 2px solid var(--secondary); padding: 20px; text-align: center; border-radius: 10px; margin: 20px 0; background: #fff; }
        .btn { background: var(--primary); color: white; padding: 12px 25px; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="status">Carregando dados da nuvem...</h2>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('listagem')">Aniversariantes do Dia</button>
        <button class="tab-btn" onclick="openTab('gerador')">Gerar Cartão</button>
    </div>

    <div id="listagem" class="tab-content active">
        <table>
            <thead><tr><th>Nome</th><th>Gestão</th></tr></thead>
            <tbody id="tabelaBody"></tbody>
        </table>
    </div>

    <div id="gerador" class="tab-content">
        <select id="selectColaborador" onchange="atualizarCard()" style="width:100%; padding:10px; margin-bottom:15px;"></select>
        <div class="card">
            <h1 style="color: var(--secondary);">Parabéns! 🎂</h1>
            <h2 id="nomeCard">---</h2>
            <p>Desejamos muito sucesso na sua caminhada!</p>
            <p>Equipe: <strong id="gestaoCard">---</strong></p>
        </div>
        <div style="text-align: center;">
            <button class="btn" onclick="enviarWhats()">📱 Enviar WhatsApp</button>
        </div>
    </div>
</div>

<script>
    // === COLE SEU LINK DO GOOGLE SHEETS (CSV) AQUI ABAIXO ===
    const URL_PLANILHA = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSlwMEifDsWv66DGuoeFfIFIy3kwf4hqGc3W924Njjhi76RkSiGLAcI_yQZawMlwYQY8R1iH89P4HU/pub?gid=0&single=true&output=csv';

    let dadosGlobal = [];

    async function buscarDados() {
        try {
            const response = await fetch(URL_PLANILHA);
            const data = await response.text();
            
            // Converte CSV em Objeto
            const linhas = data.split('\n').map(linha => linha.split(','));
            const cabecalho = linhas[0];
            
            dadosGlobal = linhas.slice(1).map(linha => {
                let obj = {};
                cabecalho.forEach((tit, i) => obj[tit.trim()] = linha[i]?.trim());
                return obj;
            });

            document.getElementById('status').innerText = "🎉 Portal de Aniversariantes";
            processar();
        } catch (e) {
            document.getElementById('status').innerText = "❌ Erro ao conectar com a planilha";
        }
    }

    function processar() {
        const hoje = new Date();
        const diaH = hoje.getDate();
        const mesH = hoje.getMonth() + 1;
        
        const tbody = document.getElementById('tabelaBody');
        const select = document.getElementById('selectColaborador');
        
        select.innerHTML = '<option value="">Selecione um colaborador...</option>';

        dadosGlobal.forEach((c, i) => {
            if(!c.Nome) return;

            // Tratando a data no formato DD/MM/AAAA ou AAAA-MM-DD
            const partes = c['Data de Nascimento'].split(/[-/]/);
            let dia, mes;
            
            if(partes[0].length === 4) { [dia, mes] = [partes[2], partes[1]]; } // AAAA-MM-DD
            else { [dia, mes] = [partes[0], partes[1]]; } // DD/MM/AAAA

            select.innerHTML += `<option value="${i}">${c.Nome}</option>`;

            if(parseInt(dia) === diaH && parseInt(mes) === mesH) {
                tbody.innerHTML += `<tr><td><strong>${c.Nome}</strong></td><td>${c.Gestão}</td></tr>`;
            }
        });

        if(!tbody.innerHTML) tbody.innerHTML = "<tr><td colspan='2'>Ninguém faz aniversário hoje.</td></tr>";
    }

    function openTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    function atualizarCard() {
        const c = dadosGlobal[document.getElementById('selectColaborador').value];
        if(!c) return;
        document.getElementById('nomeCard').innerText = c.Nome;
        document.getElementById('gestaoCard').innerText = c.Gestão;
    }

    function enviarWhats() {
        const nome = document.getElementById('nomeCard').innerText;
        const msg = encodeURIComponent(`Parabéns ${nome}! 🎉 Feliz aniversário, muita saúde e sucesso! 🎂`);
        window.open(`https://web.whatsapp.com/send?text=${msg}`, '_blank');
    }

    buscarDados();
</script>
</body>
</html>
