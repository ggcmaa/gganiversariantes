<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Aniversariantes CMAA</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { --cmaa-verde: #006838; --cmaa-escuro: #004d2c; --cmaa-claro: #e8f5e9; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 3px solid var(--cmaa-verde); padding-bottom: 15px; }
        .logo-site { height: 65px; }
        .tabs-nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 12px 25px; cursor: pointer; border: 1px solid #ddd; background: #f8f9fa; border-radius: 10px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: var(--cmaa-verde); color: white; border-color: var(--cmaa-verde); }
        .controls { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; background: #f8faf9; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #e1e8e3; }
        .search-input { padding: 10px; border-radius: 8px; border: 1px solid #ccc; flex-grow: 1; min-width: 250px; }
        .select-input { padding: 10px; border-radius: 8px; border: 1px solid #ccc; min-width: 200px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: var(--cmaa-verde); color: white; padding: 15px; text-align: left; text-transform: uppercase; font-size: 0.85em; }
        td { padding: 15px; border-bottom: 1px solid #eee; color: #444; }
        .btn-gerar { background: var(--cmaa-verde); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #view-cartao { display: none; }
        #view-cartao.active { display: block; }
        .hidden { display: none; }
        #cartao-area { width: 595px; height: 842px; background: linear-gradient(135deg, var(--cmaa-escuro) 0%, var(--cmaa-verde) 100%); color: white; padding: 50px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; margin: 0 auto; }
        .txt-topo { font-size: 26px; font-weight: bold; margin-top: 80px; text-transform: uppercase; border-bottom: 2px solid rgba(255,255,255,0.3); padding-bottom: 5px; }
        #pdfNome { font-size: 38px; font-weight: bold; margin: 40px 0; min-height: 90px; display: flex; align-items: center; justify-content: center; width: 100%; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .txt-parabens { font-size: 80px; font-family: 'Georgia', serif; font-style: italic; margin-bottom: 20px; }
        .txt-msg { font-size: 19px; line-height: 1.6; font-weight: 300; padding: 0 20px; }
        .logo-pdf { position: absolute; bottom: 70px; width: 260px; }
    </style>
</head>
<body>

<div class="container">
    <div id="view-lista">
        <div class="header-top">
            <h2 id="tituloPagina" style="color: var(--cmaa-verde); margin: 0;">Aniversariantes de Hoje</h2>
            <img src="Logo.png" class="logo-site" alt="Logo CMAA">
        </div>

        <div class="tabs-nav">
            <button class="tab-btn active" id="tabHoje" onclick="mudarAba('hoje')">Hoje</button>
            <button class="tab-btn" id="tabProximo" onclick="mudarAba('proximo')">Próximo Mês</button>
        </div>

        <div class="controls">
            <select id="filtroUnidade" class="select-input" onchange="filtrarTabela()"></select>
            <input type="text" id="buscaNome" class="search-input" placeholder="Buscar por nome do colaborador..." onkeyup="filtrarTabela()">
        </div>

        <table>
            <thead>
                <tr>
                    <th>Unidade</th>
                    <th>Matrícula</th>
                    <th>Colaborador</th>
                    <th>Data</th>
                    <th>Gestão</th>
                    <th id="thAcao">Ação</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                <tr><td colspan="6" style="text-align:center;">Lendo arquivo Excel...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="view-cartao">
        <button onclick="voltarLista()" style="margin-bottom: 20px; cursor: pointer; padding: 10px 15px; border-radius: 8px; border: 1px solid #ccc; background: #fff;">⬅ Voltar</button>
        <div id="cartao-area">
            <div class="txt-topo">Feliz Aniversário</div>
            <div id="pdfNome">NOME DO COLABORADOR</div>
            <div class="txt-parabens">Parabéns!!</div>
            <p class="txt-msg">Sua energia é a força que nos move e transforma o nosso mundo todos os dias.</p>
            <img src="Logobranco.png" class="logo-pdf" alt="Logo CMAA Branco">
        </div>
        <div style="text-align:center; margin-top:20px;">
            <button class="btn-gerar" onclick="gerarPDF()" style="padding:15px 30px;">BAIXAR PDF</button>
        </div>
    </div>
</div>

<script>
    const URL_BASE = 'https://raw.githubusercontent.com/ggcmaa/gganiversariantes/main/';
    const ARQUIVOS = ['index.xlsx', 'aniversarios.xlsx', 'data.xlsx'];
    
    let baseDados = [];
    let abaAtual = 'hoje';

    async function carregar() {
        let sucesso = false;
        for (const arq of ARQUIVOS) {
            try {
                const response = await fetch(URL_BASE + arq + "?t=" + Date.now());
                if (!response.ok) continue;
                
                const buffer = await response.arrayBuffer();
                const workbook = XLSX.read(buffer, { type: 'array' });
                const abaJson = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" });

                baseDados = abaJson.map(item => {
                    // Mapeamento exato baseado na sua imagem do Excel
                    return {
                        unidade: item["Unidade"] || "GERAL",
                        matricula: item["Matricula"] || "---",
                        nome: item["Nome"] || "---",
                        data: item["Data de Nascimento"] || "",
                        gestao: item["Gestão"] || item["Gestao"] || "---"
                    };
                });

                sucesso = true;
                break; 
            } catch (e) { console.error(e); }
        }

        if (sucesso) {
            const unidades = ["TODAS AS UNIDADES", ...new Set(baseDados.map(d => d.unidade))].sort();
            document.getElementById('filtroUnidade').innerHTML = unidades.map(u => `<option value="${u}">${u}</option>`).join('');
            filtrarTabela();
        } else {
            document.getElementById('corpoTabela').innerHTML = `<tr><td colspan="6" style="color:red; text-align:center;">Erro: Arquivo não encontrado. Verifique se o arquivo no GitHub se chama 'index.xlsx'.</td></tr>`;
        }
    }

    function filtrarTabela() {
        const uniFiltro = document.getElementById('filtroUnidade').value;
        const buscaNome = document.getElementById('buscaNome').value.toLowerCase();
        
        const hoje = new Date();
        const diaH = hoje.getDate();
        const mesH = hoje.getMonth() + 1;
        const mesP = (new Date(hoje.getFullYear(), hoje.getMonth() + 1, 1)).getMonth() + 1;

        const filtrados = baseDados.filter(d => {
            const matchesUni = uniFiltro === "TODAS AS UNIDADES" || d.unidade === uniFiltro;
            const matchesNome = d.nome.toLowerCase().includes(buscaNome);
            
            let dDia = 0, dMes = 0;
            const dataLimpa = d.data.toString().trim();

            if (dataLimpa.includes('/')) {
                const partes = dataLimpa.split('/');
                dDia = parseInt(partes[0]);
                dMes = parseInt(partes[1]);
            }

            let matchesData = (abaAtual === 'hoje') ? (dDia === diaH && dMes === mesH) : (dMes === mesP);
            return matchesUni && matchesNome && matchesData;
        });

        document.getElementById('corpoTabela').innerHTML = filtrados.length ? filtrados.map(d => `
            <tr>
                <td>${d.unidade}</td>
                <td>${d.matricula}</td>
                <td><strong>${d.nome}</strong></td>
                <td>${d.data}</td>
                <td>${d.gestao}</td>
                <td style="display: ${abaAtual === 'hoje' ? '' : 'none'}">
                    <button class="btn-gerar" onclick="abrirCartao('${d.nome}')">GERAR</button>
                </td>
            </tr>
        `).join('') : `<tr><td colspan="6" style="text-align:center;">Nenhum aniversariante encontrado para ${abaAtual === 'hoje' ? 'hoje ('+diaH.toString().padStart(2,'0')+'/'+mesH.toString().padStart(2,'0')+')' : 'o próximo mês'}.</td></tr>`;
    }

    function mudarAba(aba) {
        abaAtual = aba;
        document.getElementById('tabHoje').classList.toggle('active', aba === 'hoje');
        document.getElementById('tabProximo').classList.toggle('active', aba === 'proximo');
        document.getElementById('thAcao').style.display = aba === 'hoje' ? '' : 'none';
        filtrarTabela();
    }

    function abrirCartao(nome) {
        document.getElementById('pdfNome').innerText = nome.toUpperCase();
        document.getElementById('view-lista').classList.add('hidden');
        document.getElementById('view-cartao').classList.add('active');
    }

    function voltarLista() {
        document.getElementById('view-lista').classList.remove('hidden');
        document.getElementById('view-cartao').classList.remove('active');
    }

    function gerarPDF() {
        const area = document.getElementById('cartao-area');
        html2canvas(area, { scale: 2 }).then(canvas => {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 210, 297);
            pdf.save("Aniversario_CMAA.pdf");
        });
    }

    carregar();
</script>
</body>
</html>
