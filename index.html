<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Aniversariantes CMAA</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --cmaa-verde: #006838; --cmaa-escuro: #004d2c; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Cabeçalho e Nav */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--cmaa-verde); padding-bottom: 15px; margin-bottom: 20px; }
        .tabs-nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: 1px solid #ddd; background: #f8f9fa; border-radius: 8px; font-weight: bold; }
        .tab-btn.active { background: var(--cmaa-verde); color: white; border-color: var(--cmaa-verde); }
        
        /* Controles */
        .controls { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; align-items: center; }
        .search-input { padding: 10px; border-radius: 8px; border: 1px solid #ccc; flex-grow: 1; }
        
        /* Tabela */
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--cmaa-verde); color: white; padding: 12px; text-align: left; text-transform: uppercase; font-size: 0.85em; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        
        /* Botões */
        .btn-acao { background: var(--cmaa-verde); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-wpp { background: #25D366; }
        .btn-export { background: #1d6f42; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; display: none; }

        /* ÁREA DO CARTÃO */
        #view-cartao { display: none; text-align: center; }
        .cartao-wrapper { position: relative; width: 500px; margin: 20px auto; }
        
        #cartao-area { 
            width: 500px; height: 700px; 
            background: linear-gradient(135deg, var(--cmaa-escuro), var(--cmaa-verde)); 
            color: white; padding: 40px; border-radius: 10px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-sizing: border-box; overflow: hidden; position: relative;
        }

        .decoracao { position: absolute; font-size: 40px; opacity: 0.8; }
        .confete { top: 20px; right: 20px; }
        .balao { bottom: 100px; left: 20px; }
        .bolo { top: 20px; left: 20px; }

        .cartao-titulo { font-size: 45px; font-family: 'Georgia', serif; font-style: italic; margin: 0; }
        .cartao-nome { font-size: 32px; margin: 30px 0; font-weight: bold; text-transform: uppercase; border-bottom: 2px solid rgba(255,255,255,0.3); width: 80%; padding-bottom: 10px; }
        .cartao-msg { font-size: 20px; line-height: 1.5; padding: 0 20px; }
        .cartao-logo { margin-top: 50px; width: 220px; }

        .botoes-cartao { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div id="view-lista">
        <div class="header">
            <h2 id="tituloPagina">Aniversariantes de Hoje</h2>
            <img src="Logo.png" alt="Logo CMAA" style="height: 50px;">
        </div>

        <div class="tabs-nav">
            <button class="tab-btn active" id="tabHoje" onclick="mudarAba('hoje')">Hoje</button>
            <button class="tab-btn" id="tabProximo" onclick="mudarAba('proximo')">Próximo Mês</button>
        </div>

        <div class="controls">
            <input type="text" id="buscaNome" class="search-input" placeholder="Buscar por nome..." onkeyup="filtrarTabela()">
            <button id="btnExportar" class="btn-export" onclick="exportarExcel()">📊 Exportar para Excel</button>
        </div>

        <div id="status" style="text-align:center; padding:20px; font-weight:bold; color:#666;">Carregando dados...</div>

        <table id="tabelaAniv" style="display:none;">
            <thead>
                <tr>
                    <th>Unidade</th>
                    <th>Matrícula</th>
                    <th>Colaborador</th>
                    <th>Data</th>
                    <th id="thAcao">Ação</th>
                </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>

    <div id="view-cartao">
        <button class="btn-acao" onclick="voltarLista()" style="background:#666;">⬅ Voltar</button>
        
        <div class="cartao-wrapper">
            <div id="cartao-area">
                <span class="decoracao bolo">🎂</span>
                <span class="decoracao confete">🎉</span>
                <span class="decoracao balao">🎈</span>
                
                <h1 class="cartao-titulo">Parabéns!</h1>
                <div id="nomeColaborador" class="cartao-nome"></div>
                <p class="cartao-msg">Sua energia é a força que nos move e transforma o nosso mundo todos os dias.</p>
                <img src="Logobranco.png" class="cartao-logo" alt="CMAA">
            </div>
        </div>

        <div class="botoes-cartao">
            <button class="btn-acao" onclick="baixarPDF()">
                <i class="fas fa-file-pdf"></i> Baixar PDF
            </button>
            <a id="btnWhatsapp" href="#" target="_blank" class="btn-acao btn-wpp">
                <i class="fab fa-whatsapp"></i> Enviar WhatsApp
            </a>
        </div>
    </div>
</div>

<script>
    const URL_EXCEL = 'https://raw.githubusercontent.com/ggcmaa/gganiversariantes/main/index.xlsx';
    let baseDados = [];
    let abaAtual = 'hoje';

    async function carregarDados() {
        try {
            const resp = await fetch(URL_EXCEL + '?t=' + Date.now());
            const arrayBuffer = await resp.arrayBuffer();
            const workbook = XLSX.read(new Uint8Array(arrayBuffer), {type: 'array'});
            baseDados = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { raw: false, defval: "" });
            filtrarTabela();
        } catch (err) {
            document.getElementById('status').innerText = "Erro ao carregar arquivo.";
        }
    }

    function mudarAba(aba) {
        abaAtual = aba;
        document.getElementById('tabHoje').classList.toggle('active', aba === 'hoje');
        document.getElementById('tabProximo').classList.toggle('active', aba === 'proximo');
        document.getElementById('btnExportar').style.display = aba === 'proximo' ? 'block' : 'none';
        document.getElementById('thAcao').style.display = aba === 'hoje' ? 'table-cell' : 'none';
        filtrarTabela();
    }

    function filtrarTabela() {
        const busca = document.getElementById('buscaNome').value.toLowerCase();
        const hoje = new Date();
        const diaH = hoje.getDate().toString().padStart(2, '0');
        const mesH = (hoje.getMonth() + 1).toString().padStart(2, '0');
        const mesP = (new Date(hoje.getFullYear(), hoje.getMonth() + 1, 1).getMonth() + 1).toString().padStart(2, '0');

        const filtrados = baseDados.filter(row => {
            const nome = (row["Nome"] || row["Colaborador"] || "").toLowerCase();
            const dataRow = row["Data de Nascimento"] || row["Data"] || "";
            if (!nome.includes(busca)) return false;
            
            if (abaAtual === 'hoje') return dataRow.startsWith(`${diaH}/${mesH}`);
            const partes = dataRow.split('/');
            return partes[1] === mesP;
        });

        renderizarTabela(filtrados);
    }

    function renderizarTabela(lista) {
        const corpo = document.getElementById('corpoTabela');
        const status = document.getElementById('status');
        const tabela = document.getElementById('tabelaAniv');

        if (lista.length === 0) {
            status.style.display = 'block'; status.innerText = "Nenhum registro encontrado.";
            tabela.style.display = 'none'; return;
        }

        status.style.display = 'none'; tabela.style.display = 'table';
        corpo.innerHTML = lista.map(aniv => {
            const nome = aniv.Nome || aniv.Colaborador;
            return `<tr>
                <td>${aniv.Unidade || ""}</td>
                <td>${aniv.Matricula || aniv.Matrícula || ""}</td>
                <td><b>${nome}</b></td>
                <td>${aniv["Data de Nascimento"] || aniv.Data || ""}</td>
                <td style="display: ${abaAtual === 'hoje' ? 'table-cell' : 'none'}">
                    <button class="btn-acao" onclick="abrirCartao('${nome}')">GERAR CARTÃO</button>
                </td>
            </tr>`;
        }).join('');
    }

    function abrirCartao(nome) {
        document.getElementById('view-lista').style.display = 'none';
        document.getElementById('view-cartao').style.display = 'block';
        document.getElementById('nomeColaborador').innerText = nome.toUpperCase();
        
        // Configura link do WhatsApp
        const msg = window.encodeURIComponent(`Parabéns pelo seu dia, ${nome}! 🎂🎈`);
        document.getElementById('btnWhatsapp').href = `https://wa.me/?text=${msg}`;
    }

    function voltarLista() {
        document.getElementById('view-lista').style.display = 'block';
        document.getElementById('view-cartao').style.display = 'none';
    }

    function baixarPDF() {
        const area = document.getElementById('cartao-area');
        html2canvas(area, { scale: 2 }).then(canvas => {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 5, 5, 200, 280);
            pdf.save(`Cartao_${document.getElementById('nomeColaborador').innerText}.pdf`);
        });
    }

    function exportarExcel() {
        const ws = XLSX.utils.json_to_sheet(baseDados);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Dados");
        XLSX.writeFile(wb, "Aniversariantes.xlsx");
    }

    carregarDados();
</script>
</body>
</html>
