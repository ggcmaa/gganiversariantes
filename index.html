<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Aniversariantes</title>
    <style>
        :root { --primary: #25d366; --secondary: #128c7e; --light: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); padding: 20px; margin: 0; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .status-badge { padding: 8px; border-radius: 8px; text-align: center; margin-bottom: 20px; font-weight: bold; }
        .loading { background: #e3f2fd; color: #1976d2; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e9; color: #2e7d32; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
        .tab-btn { padding: 12px; cursor: pointer; border: none; background: none; font-weight: bold; color: #666; transition: 0.3s; }
        .tab-btn.active { color: var(--secondary); border-bottom: 3px solid var(--secondary); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: var(--secondary); color: white; }
        
        .card { border: 2px solid var(--secondary); padding: 30px; text-align: center; border-radius: 15px; margin: 20px 0; background: #fff; background-image: radial-gradient(circle at top right, #f9f9f9, #fff); }
        .btn { background: var(--primary); color: white; padding: 15px 30px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(37, 211, 102, 0.4); }
    </style>
</head>
<body>

<div class="container">
    <div id="status" class="status-badge loading">Conectando à base de dados...</div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('listagem')">Aniversariantes do Dia</button>
        <button class="tab-btn" onclick="openTab('gerador')">Gerar Cartão</button>
    </div>

    <div id="listagem" class="tab-content active">
        <table>
            <thead><tr><th>Nome</th><th>Gestão</th></tr></thead>
            <tbody id="tabelaBody"></tbody>
        </table>
    </div>

    <div id="gerador" class="tab-content">
        <label>Escolha o Colaborador:</label>
        <select id="selectColaborador" onchange="atualizarCard()" style="width:100%; padding:12px; margin: 15px 0; border-radius: 8px; border: 1px solid #ccc;"></select>
        
        <div class="card">
            <h1 style="color: var(--secondary); margin: 0;">Feliz Aniversário! 🎂</h1>
            <h2 id="nomeCard" style="font-size: 2em; margin: 15px 0;">---</h2>
            <p style="font-size: 1.1em;">Desejamos muita alegria, saúde e sucesso em sua jornada!</p>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
            <p>Atenciosamente, Equipe <strong><span id="gestaoCard">---</span></strong></p>
        </div>
        
        <div style="text-align: center;">
            <button class="btn" onclick="enviarWhats()">📱 Enviar via WhatsApp Web</button>
        </div>
    </div>
</div>
