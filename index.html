<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Aniversariantes</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #25d366; --secondary: #128c7e; --light: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.9em; margin-bottom: 15px; display: inline-block; }
        .loading { background: #fff3cd; color: #856404; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #ddd; }
        .tab-btn { padding: 12px 20px; cursor: pointer; border: none; background: none; font-weight: bold; transition: 0.3s; color: #666; }
        .tab-btn.active { color: var(--secondary); border-bottom: 3px solid var(--secondary); }
        .tab-content { display: none; animation: fadeIn 0.5s; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: var(--secondary); color: white; border-radius: 4px; }
        .card { border: 2px dashed var(--secondary); padding: 30px; text-align: center; border-radius: 15px; margin: 20px 0; background: #fff; }
        .btn { background: var(--primary); color: white; padding: 12px 25px; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div id="status" class="status-badge loading">Tentando ler base.xlsx...</div>
    <h2 style="margin-top: 0;">🎉 Portal de Aniversariantes</h2>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('listagem')">Aniversariantes do Dia</button>
        <button class="tab-btn" onclick="openTab('gerador')">Gerar Cartão</button>
    </div>

    <div id="listagem" class="tab-content active">
        <table>
            <thead>
                <tr><th>Colaborador</th><th>Data</th><th>Gestão</th></tr>
            </thead>
            <tbody id="tabelaBody"></tbody>
        </table>
    </div>

    <div id="gerador" class="tab-content">
        <label>Selecione o aniversariante:</label>
        <select id="selectColaborador" onchange="atualizarCard()" style="width:100%; padding:12px; margin: 15px 0; border-radius: 8px; border: 1px solid #ccc;"></select>
        
        <div class="card">
            <h1 style="color: var(--secondary); margin: 0;">Feliz Aniversário!</h1>
            <h2 id="nomeCard" style="margin: 10px 0;">---</h2>
            <p>Desejamos muito sucesso e felicidade em sua vida!</p>
            <p style="font-size: 0.9em; color: #666;">Equipe: <strong id="gestaoCard">---</strong></p>
        </div>
        <div style="text-align: center;">
            <button class="btn" onclick="enviarWhats()">📱 Enviar pelo WhatsApp Web</button>
        </div>
    </div>
</div>

<script>
    let dadosGlobal = [];

    // Função para carregar o arquivo
    async function carregarDados() {
        const status = document.getElementById('status');
        try {
            // O arquivo deve estar na mesma pasta no GitHub
            const response = await fetch('base.xlsx');
            if (!response.ok) throw new Error('Arquivo base.xlsx não encontrado.');
            
            const arrayBuffer = await response.arrayBuffer();
            const data = new Uint8Array(arrayBuffer);
            const workbook = XLSX.read(data, {type: 'array', cellDates: true}); // cellDates ajuda com o erro de "hung"
            const firstSheet = workbook.SheetNames[0];
            const sheet = workbook.Sheets[firstSheet];
            
            dadosGlobal = XLSX.utils.sheet_to_json(sheet);
            
            status.textContent = "✅ Dados carregados com sucesso!";
            status.className = "status-badge success";
            
            popularTudo();
        } catch (error) {
            status.textContent = "❌ Erro: " + error.message;
            status.className = "status-badge error";
            console.error(error);
        }
    }

    function popularTudo() {
        const hoje = new Date();
        const diaH = hoje.getDate();
        const mesH = hoje.getMonth() + 1;
        
        const tbody = document.getElementById('tabelaBody');
        const select = document.getElementById('selectColaborador');
        
        tbody.innerHTML = '';
        select.innerHTML = '<option value="">Escolha um colaborador...</option>';

        dadosGlobal.forEach((colab, i) => {
            let dataNasc = colab['Data de Nascimento'];
            
            // Tratamento seguro de data
            if (!(dataNasc instanceof Date)) {
                dataNasc = new Date(dataNasc);
            }

            if (!isNaN(dataNasc)) {
                const dia = dataNasc.getUTCDate();
                const mes = dataNasc.getUTCMonth() + 1;
                const dataFormatada = `${dia.toString().padStart(2, '0')}/${mes.toString().padStart(2, '0')}`;

                // Adiciona no select do gerador
                select.innerHTML += `<option value="${i}">${colab['Nome']}</option>`;

                // Verifica se é hoje
                if (dia === diaH && mes === mesH) {
                    tbody.innerHTML += `<tr>
                        <td><strong>${colab['Nome']}</strong></td>
                        <td>${dataFormatada}</td>
                        <td>${colab['Gestão'] || 'N/A'}</td>
                    </tr>`;
                }
            }
        });

        if(tbody.innerHTML === '') {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center">Nenhum aniversariante hoje.</td></tr>';
        }
    }

    function openTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function atualizarCard() {
        const index = document.getElementById('selectColaborador').value;
        if(index === "") return;
        
        const colab = dadosGlobal[index];
        document.getElementById('nomeCard').textContent = colab['Nome'];
        document.getElementById('gestaoCard').textContent = colab['Gestão'] || 'Gestão Imediata';
    }

    function enviarWhats() {
        const nome = document.getElementById('nomeCard').textContent;
        if(nome === "---") return alert("Selecione alguém primeiro!");
        
        const msg = encodeURIComponent(`Olá ${nome}! 🎉\n\nDesejamos um Feliz Aniversário, muita saúde e sucesso! 🎂✨`);
        window.open(`https://web.whatsapp.com/send?text=${msg}`, '_blank');
    }

    // Iniciar
    carregarDados();
</script>

</body>
</html>
